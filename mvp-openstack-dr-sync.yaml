- name: OpenStack DR recovery - single boot volume
  hosts: localhost
  gather_facts: no
  vars:
    source_openstack_cloud: <name of source os cloud>
    target_openstack_cloud: <name of target os cloud>
    fa_url: <replication target FlashArray IP address>
    fa_api_token: <replication target FlashArray API token>
    os_volume_name: <name of boot volume on source os cloud>
    target_os_volume_name: <name of the new boot volume on target os cloud>
    bootable: True | False
  tasks:
    - name: Preflight - validate required DR inputs
      ansible.builtin.assert:
        that:
          - source_openstack_cloud is string
          - source_openstack_cloud | length > 0
          - target_openstack_cloud is string
          - target_openstack_cloud | length > 0
          - fa_url is string
          - fa_url | length > 0
          - fa_api_token is string
          - fa_api_token | length > 0
          - os_volume_name is string
          - os_volume_name | length > 0
          - target_os_volume_name is string
          - target_os_volume_name | length > 0
        fail_msg: >-
          Missing required input. Ensure source_openstack_cloud,
          target_openstack_cloud, fa_url, fa_api_token, os_volume_name,
          and target_os_volume_name are set.

    - name: Get Cinder volume details
      openstack.cloud.volume_info:
        cloud: "{{ source_openstack_cloud }}"
        name: "{{ os_volume_name }}"
      register: os_volume_info

    - name: Extract volume image metadata from source volume
      set_fact:
        source_image_meta: "{{ source_vol.volumes[0].volume_image_metadata | default({}) }}"

    - name: Define name for cloned volume
      set_fact:
        cloned_volume_name: "cloned-from-{{ os_volume_name }}"

    - name: Sanitize cloned volume name (no dots)
      set_fact:
        cloned_volume_name_safe: "{{ cloned_volume_name | replace('.', '-') }}"

    - name: Create clone from volume in pod
      purestorage.flasharray.purefa_volume:
        name: "{{ os_volume_info.volumes[0].metadata.array_volume_name }}"
        target: "{{ cloned_volume_name_safe }}"
        overwrite: false
        fa_url: "{{ fa_url }}"
        api_token: "{{ fa_api_token }}"

    - name: Display new volume info
      debug:
        msg: "Cloned volume '{{ cloned_volume_name_safe }}' created from volume '{{ os_volume_name }}'"

    - name: Manage volume into cinder
      openstack.cloud.volume_manage:
        cloud: "{{ target_openstack_cloud }}"
        state: present
        source_name: "{{ cloned_volume_name_safe }}"
        bootable: "{{ bootable }}"
        volume_type: "{{ target_volume_type }}"
        host: "{{ target_host }}"
        name: "{{ target_os_volume_name }}"
      register: cinder_vol

    - name: Apply volume image metadata via openstacksdk
      ansible.builtin.command: python3 -
      args:
        stdin: |
          from openstack import connection
          import sys

          cloud = "{{ target_openstack_cloud }}"
          volume_id = "{{ managed_vol.volume.id }}"
          image_meta = {{ source_image_meta | to_json }}

          if not image_meta:
              print("No volume image metadata to apply")
              sys.exit(0)

          conn = connection.from_config(cloud=cloud)

          # This maps to Cinder os-set_image_metadata
          conn.block_storage.set_volume_image_metadata(
              volume_id,
              **image_meta
          )

          print(f"Applied volume image metadata to {volume_id}: {image_meta}")
      changed_when: source_image_meta | length > 0

    - name: Boot instance from managed volume
      openstack.cloud.server:
        cloud: "{{ target_openstack_cloud }}"
        state: present
        name: "{{ os_instance_name }}"
        flavor: "{{ os_flavor }}"
        key_name: "{{ os_keypair }}"
        nics:
          - net-name: "{{ os_network }}"
        security_groups: "{{ os_security_groups }}"
        boot_volume: "{{ cinder_vol.volume.name }}"
        wait: true
        timeout: 600
        # availability_zone: # Optional
        # user_data: # Optional
        # scheduler_hints: # Optional
      when: bootable | bool
